name: Optimize gallery images

on:
  push:
    paths:
      - "gallery.html"
      - "assets/gallery/**"
      - ".github/workflows/optimize-gallery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade Pillow

      - name: Create optimized WebP gallery images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          folder = Path("assets/gallery")
          for source in sorted(folder.glob("*.png")):
              target = source.with_suffix(".webp")
              with Image.open(source) as image:
                  image = ImageOps.exif_transpose(image).convert("RGB")
                  image.thumbnail((1600, 1600), Image.Resampling.LANCZOS)
                  image.save(target, "WEBP", quality=84, method=6)
                  print(f"{source.name}: {source.stat().st_size:,} -> {target.stat().st_size:,} bytes")
          PY

      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gallery/*.webp
          if git diff --cached --quiet; then
            echo "No optimized image changes."
          else
            git commit -m "Optimize gallery images as WebP"
            git push
          fi
