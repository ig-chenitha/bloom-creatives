<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="orb" cx="34%" cy="25%" r="78%">
      <stop offset="0" stop-color="#176dff"/>
      <stop offset=".38" stop-color="#0b35bd"/>
      <stop offset=".76" stop-color="#07145f"/>
      <stop offset="1" stop-color="#02091f"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d7ff"/>
      <stop offset=".48" stop-color="#347dff"/>
      <stop offset="1" stop-color="#08245f"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><circle cx="256" cy="256" r="232"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#020617"/>
  <circle cx="256" cy="256" r="239" fill="url(#orb)" stroke="url(#rim)" stroke-width="12" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#6bcaff" stroke-opacity=".22" stroke-width="2"/>
  <g clip-path="url(#clip)">
    <image href="Bloom%20White%20Symbol%20Removebg.png" x="-128" y="-128" width="768" height="768" preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>